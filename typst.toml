[package]
name = "modern-short-story"
version = "0.1.0"
entrypoint = "lib.typ"
authors = ["North Pass Press <https://northpass.press>"]
license = "MIT-0"
description = "A clean, editorial-grade layout for short stories and literary fiction, with title and copyright pages, running headers, scene breaks, and verse."
# repository = "https://github.com/mnogradi/modern-short-story"
keywords = ["short story", "fiction", "literature", "book", "manuscript", "typography"]
categories = ["book"]
compiler = "0.15.1"
exclude = ["guide.typ", ".gitignore", ".gitattributes"]

[template]
path = "template"
entrypoint = "main.typ"
thumbnail = "thumbnail.png"
